[build]
  publish = "site"

[[headers]]
  for = "/engine/*"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/artifacts/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/artifacts/*.csv"
  [headers.values]
    Content-Type = "text/csv; charset=utf-8"

[[headers]]
  for = "/artifacts/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
